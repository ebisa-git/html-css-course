<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .cat{
            width: 200px;
            border-radius: 20px;
        }
        .cat2{
            width: 200px;
            height: 200px;
            object-fit: cover;
            object-position: center;
        }
        .cat3{
            width: 200px;
            height: 200px;
            object-fit: cover;
            object-position: center;
            border-radius: 100px;
        }
        .search-1{
            margin-top: 30px;
            font-size: 20px;
            color: rgb(108, 117, 125);
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 18px;
            border-width: 1px;
            border-style: solid;
            border-radius: 10px;
            border-color: rgb(213, 218, 223);
        }
        .search-2{
            margin-top: 30px;
            font-size: 20px;
            color: rgb(108, 117, 125);
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 18px;
            width: 500px;
            border: none;
            border-radius: 20px;
            box-shadow: 2px 2px 15px rgba(85, 79, 79, 0.3);
        }
        .email{
            font-size: 15px;
            color: rgb(108, 117, 125);
        }
        .email-box{
            font-size: 20px;
            width: 350px;
            border-style: solid;
            border-radius: 3px;
            
        }
        .disclaimer{
            font-size: 15px;
            color: rgb(57, 57, 58);
            width: 350px;
            text-align: center;
        }
        .agree{
            background-color: rgb(75, 127, 240);
            color: white;
            width: 350px;
            padding-top: 15px;
            padding-bottom: 15px;
            border: none;
            border-radius: 32px;
            font-size: 18px;
        }
        .img-4{
            margin-top: 40px;
            width: 50px;
            height: 50px;
            object-fit: cover;
            object-position: center;
            border-radius: 25px;
            vertical-align: middle;
            margin-bottom: 100px;
        }
        .tweet-input{
            font-size: 18PX;
            margin-top: 40px;
            vertical-align: middle;
            padding-left: 5PX;
            border: none;
            width: 300px;
            margin-bottom: 100px;
        }
        .tweet-button{
            margin-top: 40px;
            vertical-align: middle;
            background-color: rgb(81, 133, 230);
            color: white;
            font-weight: bold;
            font-size: 18px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-right: 20px;
            padding-left: 20px;
            border: none;
            border-radius: 20px;
            margin-bottom: 100px;
        }
    </style>
    <title>Document</title>
</head>

<body>
    <img src="cat.jpg" class="cat">
    <img src="cat.jpg" class="cat2">
    <img src="cat.jpg" class="cat3">
    <br>
    <input type="text" class="search-1" placeholder="Search">
    <br>
    <input type="text" class="search-2" placeholder="Search Google or type a URL">
    <br>

    <p class="email">
        Email
    </p>

    <input type="text" class="email-box">

    <p class="disclaimer">
        By clicking agree &amp; join, you agree to the privacy policy.
    </p>

    <button class="agree">
        Agree & Join
    </button>
    <br>

    <img src="cat.jpg" alt="" class="img-4">    
    <input type="text" class="tweet-input" placeholder="Whats happening?">
    <button class="tweet-button">
        Tweet
    </button>



</body>
</html>
