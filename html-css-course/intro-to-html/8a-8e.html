<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .name,
        .email {
            display: block;
            margin-bottom: 5px;
        }

        .paragraph,
        .yes,
        .no {
            display: inline-block;
        }

        .paragraph {
            width: 200px;
            vertical-align: middle;
        }

        .g-logo {
            display: block;
            margin-top: 50px;
            width: 250px;
            margin-left: 400px;
        }

        .g-search {
            width: 350px;
            padding-top: 8px;
            padding-bottom: 8px;
            padding-right: 10px;
            padding-left: 10px;
            border: none;
            border-radius: 20px;
            box-shadow: 2px 2px 10px rgba(112, 111, 111, 0.3);
            margin-left: 350px;
            margin-top: 10px;
        }

        .email2,
        .sign-up {
            display: block;
        }

        .first-name,
        .last-name {
            width: 120px;
            font-size: 16px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-right: 10px;
            padding-left: 10px;
            border-style: solid;
            border-width: 1px;
            border-radius: 10px;
            border-color: rgb(143, 146, 148);
            color: rgb(143, 146, 148);
        }

        .email2 {
            width: 265px;
            font-size: 16px;
            margin-top: 10px;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 10px;
            padding-bottom: 10px;
            border-style: solid;
            border-width: 1px;
            border-radius: 10px;
            border-color: rgb(143, 146, 148);
            color: rgb(143, 146, 148);
        }

        .sign-up {
            width: 285px;
            font-size: 18px;
            margin-top: 10px;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 15px;
            padding-bottom: 15px;
            border: none;
            border-width: 1px;
            border-radius: 10px;
            background-color: rgb(60, 118, 241);
            color: white;
        }

        .location,
        .destination {
            display: block;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 18px;
            width: 300px;
            border: none;
            background-color: rgb(230, 227, 227);
            margin-bottom: 5px;
        }

        .request {
            font-size: 30px;
            font-family: Arial, sans-serif;
            margin-bottom: 20px;
        }

        .request2 , .schedule {
            font-size: 12px;
            font-family: Arial, sans-serif;
            margin-bottom: 20px;
            margin-top: 30px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 18px;
            padding-right: 18px;
            border: none;
        }
        .request2{
            background-color: black;
            color: white;
            padding-right: 22px;
        }
    </style>
    <title>8a-7e </title>
</head>

<body>
    <input type="text" class="name" placeholder="Name">
    <input type="text" class="email" placeholder="Email">

    <p class="paragraph">
        Thanks for chatting with our customer support. Would you like to take our quick survey?
    </p>


    <button class="yes">
        Yes
    </button>
    <button class="no">
        No
    </button>

    <img src="google-logo.png" alt="" class="g-logo">
    <input type="text" class="g-search" placeholder="Search google or type a URL">


    <input type="text" class="first-name" placeholder="First name">
    <input type="text" class="last-name" placeholder="Last name">
    <input type="text" class="email2" placeholder="Email">
    <button class="sign-up">
        Sign Up
    </button>


    <p class="request">
        Request a ride now
    </p>

    <input type="text" class="location" placeholder="Enter pickup location">
    <input type="text" class="destination" placeholder="Enter destination">

    <button class="request2">
        Request now
    </button>
    <button class="schedule">
        Schedule for later
    </button>
</body>

</html>
